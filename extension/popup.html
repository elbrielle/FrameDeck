<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <!-- Header -->
    <div class="header">
      <div class="header-title">
        <div class="logo-mark">
          <svg width="14" height="14" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="14" rx="2"/>
            <path d="M7 21h10M12 17v4"/>
          </svg>
        </div>
        <span>FrameDeck</span>
      </div>
      <div class="header-status" id="statusBadge"></div>
    </div>

    <!-- Profiles -->
    <div class="section">
      <div class="section-label">Profile</div>
      <div class="profile-row">
        <select id="profileSelect" class="profile-select">
          <option value="">-- None --</option>
        </select>
        <button class="icon-btn" id="loadProfileBtn" title="Load profile tabs">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button class="icon-btn" id="saveProfileBtn" title="Save current setup">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        </button>
        <button class="icon-btn icon-btn-danger" id="deleteProfileBtn" title="Delete profile">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        </button>
      </div>
    </div>

    <!-- Tab List -->
    <div class="section">
      <div class="section-label">Tabs in rotation</div>
      <div class="tab-list" id="tabList">
        <div class="tab-list-loading">Loading tabs...</div>
      </div>
      <div class="tab-actions">
        <button class="link-btn" id="selectAllBtn">Select all</button>
        <span class="tab-actions-divider">|</span>
        <button class="link-btn" id="selectNoneBtn">Select none</button>
      </div>
    </div>

    <!-- Settings -->
    <div class="section">
      <div class="section-label">Settings</div>
      <div class="setting-row">
        <span class="setting-label">Default interval</span>
        <div class="interval-compact">
          <input type="number" id="intervalInput" min="5" max="600" value="30">
          <span class="interval-unit">sec</span>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Countdown overlay</span>
        <label class="toggle-switch">
          <input type="checkbox" id="countdownToggle" checked>
          <span class="toggle-track"></span>
        </label>
      </div>
      <div class="setting-row">
        <span class="setting-label">Fade transitions</span>
        <label class="toggle-switch">
          <input type="checkbox" id="transitionsToggle" checked>
          <span class="toggle-track"></span>
        </label>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn-primary" id="startBtn">
        <svg class="btn-icon" width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <span>Start Rotation</span>
      </button>
      <div class="active-controls" id="activeControls" style="display:none">
        <div class="control-row">
          <button class="btn-secondary" id="prevBtn" title="Previous tab (Alt+Left)">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button class="btn-primary btn-flex" id="pauseResumeBtn">
            <svg id="pauseIcon" width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
            <svg id="playIcon" width="16" height="16" fill="currentColor" viewBox="0 0 24 24" style="display:none"><path d="M8 5v14l11-7z"/></svg>
            <span id="pauseResumeLabel">Pause</span>
          </button>
          <button class="btn-secondary" id="nextBtn" title="Next tab (Alt+Right)">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>
        <button class="btn-danger" id="stopBtn">Stop Rotation</button>
      </div>
    </div>

    <!-- Hints -->
    <div class="hints">
      <span class="kbd">Alt+Space</span> play/pause
      <span class="kbd">Alt+&larr;</span><span class="kbd">Alt+&rarr;</span> navigate
      <span class="hint-sep">&middot;</span>
      <span class="kbd">F11</span> fullscreen
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
